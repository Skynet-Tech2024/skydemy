{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* ----- Form Container ----- */
        #content-main {
            max-width: 900px;
            margin: 0 auto;
        }
        .skydemy-form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 35px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            margin-top: 20px;
        }
        .skydemy-form-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
        }

        /* ----- Form Rows ----- */
        .form-row {
            padding: 12px 0 !important;
            border-bottom: 1px solid #f8fafc !important;
        }
        .form-row:last-child {
            border-bottom: none !important;
        }
        .form-row label {
            font-weight: 600 !important;
            color: #1e293b !important;
            font-size: 14px !important;
            min-width: 150px !important;
        }
        .form-row .field-box {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .form-row .field-box label {
            min-width: 120px;
        }

        /* ----- Inputs ----- */
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="url"],
        textarea,
        select {
            border-radius: 10px !important;
            padding: 10px 14px !important;
            border: 1px solid #d1d5db !important;
            font-size: 14px !important;
            transition: border 0.2s, box-shadow 0.2s !important;
            width: 100% !important;
            max-width: 500px;
            background: #ffffff;
        }
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus,
        textarea:focus,
        select:focus {
            border-color: #0E8A3A !important;
            box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.15) !important;
            outline: none !important;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ----- Buttons (Submit Row) ----- */
        .submit-row {
            background: #f8fafc !important;
            border-radius: 12px !important;
            padding: 16px 24px !important;
            margin-top: 30px !important;
            border: 1px solid #e5e7eb !important;
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
            align-items: center !important;
        }
        .submit-row input[type="submit"],
        .submit-row a.deletelink {
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            transition: all 0.2s !important;
            border: none !important;
        }
        .submit-row input[type="submit"]:hover {
            transform: translateY(-1px) !important;
            box-shadow: 0 4px 12px rgba(14, 138, 58, 0.3) !important;
        }
        .submit-row input[type="submit"]:first-child {
            background: #0E8A3A !important;
            color: #ffffff !important;
        }
        .submit-row input[type="submit"]:first-child:hover {
            background: #06612A !important;
        }
        .submit-row .deletelink {
            background: #DC2626 !important;
            color: #ffffff !important;
        }
        .submit-row .deletelink:hover {
            background: #B91C1C !important;
        }

        /* ----- Help Text ----- */
        .help, .help-text {
            color: #64748B !important;
            font-size: 13px !important;
            margin-top: 4px !important;
        }

        /* ----- Errors ----- */
        .errornote {
            background: #FEE2E2 !important;
            border-left: 4px solid #DC2626 !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            color: #991B1B !important;
        }
        .errorlist {
            color: #DC2626 !important;
            font-weight: 500 !important;
        }

        /* ----- Responsive ----- */
        @media (max-width: 767px) {
            .skydemy-form-card {
                padding: 16px !important;
            }
            .form-row .field-box {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .form-row .field-box label {
                min-width: auto !important;
            }
            input[type="text"],
            input[type="password"],
            input[type="email"],
            input[type="number"],
            input[type="url"],
            textarea,
            select {
                max-width: 100% !important;
            }
        }
    </style>
{% endblock %}

{% block content %}
<div id="content-main">
    <div class="skydemy-form-card">
        {% if title %}
            <h2>{{ title }}</h2>
        {% endif %}
        {{ block.super }}
    </div>
</div>
{% endblock %}
