{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'admin/css/custom_admin.css' %}">
    <style>
        /* ----- Layout ----- */
        #content-main {
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .skydemy-form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            margin-top: 10px;
            animation: fadeUp 0.4s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- Card-based sections ----- */
        .skydemy-section-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 24px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .skydemy-section-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .skydemy-section-card .card-header {
            background: #f8fafc;
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: #0E8A3A;
        }
        .skydemy-section-card .card-header .icon {
            font-size: 18px;
        }
        .skydemy-section-card .card-body {
            padding: 16px 20px 20px 20px;
        }

        /* ----- Hide default fieldset styles ----- */
        .module {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }
        .module h2 {
            display: none !important;
        }
        .module .form-row {
            border-bottom: 1px solid #f1f5f9 !important;
            padding: 10px 0 !important;
        }
        .module .form-row:last-child {
            border-bottom: none !important;
        }

        /* ----- Two‑column grid ----- */
        .col2 .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
            padding: 8px 0 !important;
        }
        .col2 .form-row .field-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .col2 .form-row .field-box label {
            min-width: auto !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            color: #1e293b !important;
            margin-bottom: 2px;
        }

        /* ----- Inputs (high contrast) ----- */
        .col2 .form-row input,
        .col2 .form-row select,
        .col2 .form-row textarea {
            max-width: 100% !important;
            height: 46px !important;
            padding: 10px 16px !important;
            border-radius: 8px !important;
            border: 1px solid #ced4da !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: #212529 !important;
            background: #ffffff !important;
            transition: border 0.2s, box-shadow 0.2s !important;
        }
        .col2 .form-row textarea {
            height: auto !important;
            min-height: 100px !important;
        }
        .col2 .form-row input:focus,
        .col2 .form-row select:focus,
        .col2 .form-row textarea:focus {
            border-color: #0E8A3A !important;
            box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.15) !important;
            outline: none !important;
        }

        /* ----- Help text (darker) ----- */
        .help, .help-text {
            color: #6b7280 !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            margin-top: 2px !important;
        }

        /* ----- Hide duplicate title ----- */
        .skydemy-form-card h1,
        .skydemy-form-card h2,
        .skydemy-form-card .module h1,
        .skydemy-form-card .module h2 {
            display: none !important;
        }

        /* ----- Submit row ----- */
        .submit-row {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 20px 0 !important;
            margin: 0 !important;
            background: transparent !important;
            border: none !important;
            gap: 16px !important;
            flex-wrap: wrap !important;
        }
        .submit-row input[type="submit"],
        .submit-row .deletelink,
        .submit-row .cancel-link {
            display: none !important;
        }
        .submit-row .btn-submit-review {
            background: #0E8A3A !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 12px 40px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            font-family: 'Inter', sans-serif !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 10px !important;
            box-shadow: 0 4px 12px rgba(14, 138, 58, 0.3) !important;
            transition: all 0.2s !important;
            height: 50px !important;
        }
        .submit-row .btn-submit-review:hover {
            background: #06612A !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(14, 138, 58, 0.4) !important;
        }
        .submit-row .btn-submit-review i {
            font-size: 18px;
        }

        /* ----- Responsive ----- */
        @media (max-width: 767px) {
            .col2 .form-row {
                grid-template-columns: 1fr !important;
                gap: 6px !important;
            }
            .skydemy-form-card {
                padding: 16px !important;
            }
            .skydemy-section-card .card-body {
                padding: 12px 14px !important;
            }
        }
    </style>
{% endblock %}

{% block submit_buttons_bottom %}
    <div class="submit-row">
        <button type="submit" name="_save" class="btn-submit-review">
            <i class="fas fa-paper-plane"></i> Submit Exam for Review
        </button>
    </div>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script src="{% static 'admin/js/custom_admin.js' %}"></script>
{% endblock %}
