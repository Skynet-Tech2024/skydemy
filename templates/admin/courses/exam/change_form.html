{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* ----- Layout ----- */
        #content-main {
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .skydemy-form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            margin-top: 10px;
            animation: fadeUp 0.4s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- Section Headers ----- */
        .fieldset-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin: 20px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fieldset-title:first-of-type {
            margin-top: 0;
        }

        /* ----- Two‑column grid ----- */
        .col2 .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
            padding: 8px 0 !important;
        }
        .col2 .form-row .field-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .col2 .form-row .field-box label {
            min-width: auto !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            color: #1e293b !important;
            margin-bottom: 2px;
        }

        /* ----- Inputs (high contrast) ----- */
        .col2 .form-row input,
        .col2 .form-row select,
        .col2 .form-row textarea {
            max-width: 100% !important;
            height: 46px !important;
            padding: 10px 16px !important;
            border-radius: 8px !important;
            border: 1px solid #ced4da !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: #212529 !important;
            background: #ffffff !important;
            transition: border 0.2s, box-shadow 0.2s !important;
        }
        .col2 .form-row textarea {
            height: auto !important;
            min-height: 100px !important;
        }
        .col2 .form-row input:focus,
        .col2 .form-row select:focus,
        .col2 .form-row textarea:focus {
            border-color: #0E8A3A !important;
            box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.15) !important;
            outline: none !important;
        }

        /* ----- Premium file input with preview ----- */
        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .file-upload-wrapper input[type="file"] {
            padding: 0 !important;
            height: auto !important;
            border: none !important;
            background: transparent !important;
        }
        .file-upload-wrapper input[type="file"]::file-selector-button {
            background: #0E8A3A !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 20px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            font-family: 'Inter', sans-serif !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            margin-right: 12px !important;
        }
        .file-upload-wrapper input[type="file"]::file-selector-button:hover {
            background: #06612A !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 4px 12px rgba(14, 138, 58, 0.3) !important;
        }
        .file-upload-wrapper input[type="file"]:focus {
            outline: none !important;
        }
        .file-upload-wrapper input[type="file"]:focus::file-selector-button {
            outline: 2px solid #D4AF37 !important;
            outline-offset: 2px;
        }
        .file-upload-wrapper input[type="file"] {
            color: #212529 !important;
            font-size: 14px !important;
        }
        /* File preview info */
        .file-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            color: #1e293b;
            margin-top: 4px;
            min-height: 40px;
        }
        .file-preview .file-icon {
            font-size: 18px;
            color: #0E8A3A;
        }
        .file-preview .file-name {
            font-weight: 500;
            flex: 1;
        }
        .file-preview .file-size {
            color: #6B7280;
            font-size: 13px;
        }
        .file-preview .file-status {
            color: #16A34A;
            font-weight: 600;
            font-size: 13px;
        }
        .file-preview .file-status.empty {
            color: #9CA3AF;
        }
        .file-preview .file-status.error {
            color: #DC2626;
        }

        /* ----- Help text (darker) ----- */
        .help, .help-text {
            color: #6b7280 !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            margin-top: 2px !important;
        }

        /* ----- Hide duplicate title ----- */
        .skydemy-form-card h1,
        .skydemy-form-card h2,
        .skydemy-form-card .module h1,
        .skydemy-form-card .module h2 {
            display: none !important;
        }

        /* ----- Submit row ----- */
        .submit-row {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 20px 0 !important;
            margin: 0 !important;
            background: transparent !important;
            border: none !important;
            gap: 16px !important;
            flex-wrap: wrap !important;
        }
        .submit-row input[type="submit"],
        .submit-row .deletelink,
        .submit-row .cancel-link {
            display: none !important;
        }
        .submit-row .btn-submit-review {
            background: #0E8A3A !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 12px 40px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            font-family: 'Inter', sans-serif !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 10px !important;
            box-shadow: 0 4px 12px rgba(14, 138, 58, 0.3) !important;
            transition: all 0.2s !important;
            height: 50px !important;
        }
        .submit-row .btn-submit-review:hover {
            background: #06612A !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(14, 138, 58, 0.4) !important;
        }
        .submit-row .btn-submit-review i {
            font-size: 18px;
        }

        /* ----- Responsive ----- */
        @media (max-width: 767px) {
            .col2 .form-row {
                grid-template-columns: 1fr !important;
                gap: 6px !important;
            }
            .skydemy-form-card {
                padding: 16px !important;
            }
        }
    </style>
{% endblock %}

{% block submit_buttons_bottom %}
    <div class="submit-row">
        <button type="submit" name="_save" class="btn-submit-review">
            <i class="fas fa-paper-plane"></i> Submit Exam for Review
        </button>
    </div>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add file preview to all file inputs
            document.querySelectorAll('input[type="file"]').forEach(function(fileInput) {
                // Create preview container
                var wrapper = document.createElement('div');
                wrapper.className = 'file-upload-wrapper';
                fileInput.parentNode.insertBefore(wrapper, fileInput);
                wrapper.appendChild(fileInput);

                var preview = document.createElement('div');
                preview.className = 'file-preview';
                preview.innerHTML = `
                    <span class="file-icon">📄</span>
                    <span class="file-name">No file chosen</span>
                    <span class="file-size"></span>
                    <span class="file-status empty">—</span>
                `;
                wrapper.appendChild(preview);

                fileInput.addEventListener('change', function() {
                    var fileName = this.files.length > 0 ? this.files[0].name : 'No file chosen';
                    var fileSize = '';
                    var status = '';
                    var icon = '📄';
                    if (this.files.length > 0) {
                        var size = this.files[0].size;
                        if (size < 1024 * 1024) {
                            fileSize = (size / 1024).toFixed(1) + ' KB';
                        } else {
                            fileSize = (size / (1024 * 1024)).toFixed(1) + ' MB';
                        }
                        status = '✅ Ready';
                        icon = '📄';
                    } else {
                        status = '—';
                        icon = '📄';
                    }
                    preview.querySelector('.file-name').textContent = fileName;
                    preview.querySelector('.file-size').textContent = fileSize;
                    preview.querySelector('.file-status').textContent = status;
                    preview.querySelector('.file-status').className = 'file-status' + (this.files.length > 0 ? '' : ' empty');
                });
            });
        });
    </script>
{% endblock %}
