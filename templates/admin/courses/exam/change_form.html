{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* ----- Layout ----- */
        #content-main {
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .skydemy-form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            margin-top: 10px;
            animation: fadeUp 0.4s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- Section Headers ----- */
        .fieldset-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin: 20px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fieldset-title:first-of-type {
            margin-top: 0;
        }

        /* ----- Two‑column grid ----- */
        .col2 .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
            padding: 8px 0 !important;
        }
        .col2 .form-row .field-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .col2 .form-row .field-box label {
            min-width: auto !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            color: #1e293b !important;
            margin-bottom: 2px;
        }

        /* ----- Inputs (high contrast) ----- */
        .col2 .form-row input,
        .col2 .form-row select,
        .col2 .form-row textarea {
            max-width: 100% !important;
            height: 46px !important;
            padding: 10px 16px !important;
            border-radius: 8px !important;
            border: 1px solid #ced4da !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: #212529 !important;
            background: #ffffff !important;
            transition: border 0.2s, box-shadow 0.2s !important;
        }
        .col2 .form-row textarea {
            height: auto !important;
            min-height: 100px !important;
        }
        .col2 .form-row input:focus,
        .col2 .form-row select:focus,
        .col2 .form-row textarea:focus {
            border-color: #0E8A3A !important;
            box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.15) !important;
            outline: none !important;
        }

        /* ============================================
           DRAG & DROP FILE UPLOAD
           ============================================ */
        .file-drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            background: #fafbfc;
            cursor: pointer;
            position: relative;
        }
        .file-drop-zone:hover {
            border-color: #0E8A3A;
            background: #f0fdf4;
        }
        .file-drop-zone.dragover {
            border-color: #0E8A3A;
            background: #e8f5e9;
            box-shadow: 0 0 0 3px rgba(14, 138, 58, 0.15);
        }
        .file-drop-zone .drop-icon {
            font-size: 40px;
            color: #0E8A3A;
            display: block;
            margin-bottom: 8px;
        }
        .file-drop-zone .drop-text {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
        }
        .file-drop-zone .drop-subtext {
            font-size: 14px;
            color: #6B7280;
            margin-top: 4px;
        }
        .file-drop-zone .drop-formats {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 8px;
        }
        .file-drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-drop-zone .file-preview-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            padding: 10px 16px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .file-drop-zone .file-preview-info .file-icon {
            font-size: 24px;
        }
        .file-drop-zone .file-preview-info .file-name {
            font-weight: 600;
            color: #1e293b;
        }
        .file-drop-zone .file-preview-info .file-size {
            color: #6B7280;
            font-size: 13px;
        }
        .file-drop-zone .file-preview-info .file-status {
            color: #16A34A;
            font-weight: 600;
        }
        .file-drop-zone .file-preview-info .file-status.empty {
            color: #9CA3AF;
        }
        /* Hide the default "No file chosen" text */
        .file-drop-zone input[type="file"]::file-selector-button {
            display: none !important;
        }
        .file-drop-zone input[type="file"] {
            color: transparent !important;
        }

        /* ----- Help text (darker) ----- */
        .help, .help-text {
            color: #6b7280 !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            margin-top: 2px !important;
        }

        /* ----- Hide duplicate title ----- */
        .skydemy-form-card h1,
        .skydemy-form-card h2,
        .skydemy-form-card .module h1,
        .skydemy-form-card .module h2 {
            display: none !important;
        }

        /* ----- Submit row ----- */
        .submit-row {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            padding: 20px 0 !important;
            margin: 0 !important;
            background: transparent !important;
            border: none !important;
            gap: 16px !important;
            flex-wrap: wrap !important;
        }
        .submit-row input[type="submit"],
        .submit-row .deletelink,
        .submit-row .cancel-link {
            display: none !important;
        }
        .submit-row .btn-submit-review {
            background: #0E8A3A !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 12px 40px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            font-family: 'Inter', sans-serif !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 10px !important;
            box-shadow: 0 4px 12px rgba(14, 138, 58, 0.3) !important;
            transition: all 0.2s !important;
            height: 50px !important;
        }
        .submit-row .btn-submit-review:hover {
            background: #06612A !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(14, 138, 58, 0.4) !important;
        }
        .submit-row .btn-submit-review i {
            font-size: 18px;
        }

        /* ----- Responsive ----- */
        @media (max-width: 767px) {
            .col2 .form-row {
                grid-template-columns: 1fr !important;
                gap: 6px !important;
            }
            .skydemy-form-card {
                padding: 16px !important;
            }
        }
    </style>
{% endblock %}

{% block submit_buttons_bottom %}
    <div class="submit-row">
        <button type="submit" name="_save" class="btn-submit-review">
            <i class="fas fa-paper-plane"></i> Submit Exam for Review
        </button>
    </div>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Convert all file inputs to drag‑and‑drop zones
            document.querySelectorAll('input[type="file"]').forEach(function(fileInput) {
                // Skip if already wrapped
                if (fileInput.closest('.file-drop-zone')) return;

                var wrapper = document.createElement('div');
                wrapper.className = 'file-drop-zone';

                // Build drop zone content
                wrapper.innerHTML = `
                    <span class="drop-icon">📄</span>
                    <div class="drop-text">Drop your file here or click to browse</div>
                    <div class="drop-subtext">PDF, DOC, DOCX supported</div>
                    <div class="drop-formats">Max file size: 20 MB</div>
                    <div class="file-preview-info" style="display:none;">
                        <span class="file-icon">📄</span>
                        <span class="file-name"></span>
                        <span class="file-size"></span>
                        <span class="file-status">✅ Ready</span>
                    </div>
                `;

                // Move the file input inside the drop zone
                fileInput.parentNode.insertBefore(wrapper, fileInput);
                wrapper.appendChild(fileInput);

                // Drag events
                wrapper.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.classList.add('dragover');
                });
                wrapper.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    this.classList.remove('dragover');
                });
                wrapper.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('dragover');
                    if (e.dataTransfer.files.length > 0) {
                        fileInput.files = e.dataTransfer.files;
                        fileInput.dispatchEvent(new Event('change'));
                    }
                });

                // File selection preview
                fileInput.addEventListener('change', function() {
                    var preview = wrapper.querySelector('.file-preview-info');
                    var fileName = preview.querySelector('.file-name');
                    var fileSize = preview.querySelector('.file-size');
                    var fileStatus = preview.querySelector('.file-status');

                    if (this.files.length > 0) {
                        var file = this.files[0];
                        var size = file.size;
                        var sizeStr = '';
                        if (size < 1024 * 1024) {
                            sizeStr = (size / 1024).toFixed(1) + ' KB';
                        } else {
                            sizeStr = (size / (1024 * 1024)).toFixed(1) + ' MB';
                        }
                        fileName.textContent = file.name;
                        fileSize.textContent = sizeStr;
                        fileStatus.textContent = '✅ Ready';
                        fileStatus.className = 'file-status';
                        preview.style.display = 'flex';
                    } else {
                        preview.style.display = 'none';
                    }
                });
            });
        });
    </script>
{% endblock %}
