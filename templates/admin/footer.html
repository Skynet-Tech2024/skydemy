{% load static %}
<div style="
    margin-top: 40px;
    padding: 20px 24px;
    border-top: 2px solid #D4AF37;
    background: #F8FAFC;
    border-radius: 0 0 12px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #475569;
">
    <!-- Left: Brand + Copyright -->
    <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-weight: 700; font-size: 18px; color: #0B7A3B;">
            <span style="color: #D4AF37;">SKY</span>DEMY
        </span>
        <span style="color: #94A3B8;">|</span>
        <span>&copy; {% now "Y" %} SKYDEMY. All rights reserved.</span>
    </div>

    <!-- Center: Quick links -->
    <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
        <a href="#" style="color: #475569; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#0B7A3B'" onmouseout="this.style.color='#475569'">Privacy Policy</a>
        <span style="color: #CBD5E1;">|</span>
        <a href="#" style="color: #475569; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#0B7A3B'" onmouseout="this.style.color='#475569'">Terms of Service</a>
        <span style="color: #CBD5E1;">|</span>
        <a href="#" style="color: #475569; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#0B7A3B'" onmouseout="this.style.color='#475569'">Contact</a>
    </div>

    <!-- Right: Version -->
    <div style="display: flex; align-items: center; gap: 8px; color: #94A3B8;">
        <i class="fas fa-code" style="font-size: 12px;"></i>
        <span>Version 2.0</span>
    </div>
</div>
